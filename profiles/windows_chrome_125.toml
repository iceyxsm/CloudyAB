# CloudyAB Fingerprint Profile: Chrome 125 on Windows 11
# Place .toml files in this directory to add more profiles.
# CloudyAB will randomly select one on startup.

name = "windows_chrome_125"

[os]
platform = "Windows"
os_cpu = "Windows NT 10.0; Win64; x64"
architecture = "x86_64"

[tls]
cipher_suites = [
    "TLS_AES_128_GCM_SHA256",
    "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
]
extensions = [
    "server_name",
    "supported_groups",
    "key_share",
    "supported_versions",
]
elliptic_curves = ["X25519", "P-256", "P-384"]
ec_point_formats = ["uncompressed"]

[navigator]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
platform = "Win32"
language = "en-US"
languages = ["en-US", "en"]
hardware_concurrency = 8
device_memory = 8
vendor = "Google Inc."
max_touch_points = 0

[screen]
width = 1920
height = 1080
avail_width = 1920
avail_height = 1040
color_depth = 24
pixel_ratio = 1.0

[webgl]
vendor = "Google Inc. (NVIDIA)"
renderer = "ANGLE (NVIDIA, NVIDIA GeForce RTX 3060 Direct3D11 vs_5_0 ps_5_0, D3D11)"
